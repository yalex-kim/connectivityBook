name: Check Library · Pages redirect
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # 잡 이름 test 를 바꾸지 않는다: NAS(connbook.yalex-k.com)가 이 체크를 통과한 main 커밋만 배포한다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 책마다 복사해 쓰는 공통 코드(js/common.js, css/style.css)가 shared/ 원본과 같은가
      - name: Shared code in sync
        run: python3 tools/sync_shared.py --check
      - name: Library search index up to date
        run: python3 tools/build_search.py --check
      - name: Glossary terms have tooltips
        run: python3 tools/mark_terms.py --check
      - name: Spec citations link to the Core spec
        run: python3 tools/spec_links.py --check
      # 책마다 scripts/verify-factcheck.cjs가 있으면 실행한다
      - name: Verify every book
        run: |
          set -e
          for f in */scripts/verify-factcheck.cjs; do
            [ -e "$f" ] || continue
            echo "::group::$f"; node "$f"; echo "::endgroup::"
          done
      - name: Pages redirect site builds
        run: python3 tools/pages_redirect.py /tmp/pages-redirect
  # 예전 GitHub Pages 주소로 오는 사람을 connbook.yalex-k.com 의 같은 페이지로 넘긴다 (서재 본체는 NAS 가 서빙)
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build redirect site
        run: python3 tools/pages_redirect.py _redirect
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
      - id: deployment
        uses: actions/deploy-pages@v4
