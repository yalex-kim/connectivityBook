name: Deploy Library
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 책마다 복사해 쓰는 공통 코드(js/common.js, css/style.css)가 shared/ 원본과 같은가
      - name: Shared code in sync
        run: python3 tools/sync_shared.py --check
      - name: Library search index up to date
        run: python3 tools/build_search.py --check
      - name: Glossary terms have tooltips
        run: python3 tools/mark_terms.py --check
      # 책마다 scripts/verify-factcheck.cjs가 있으면 실행한다
      - name: Verify every book
        run: |
          set -e
          for f in */scripts/verify-factcheck.cjs; do
            [ -e "$f" ] || continue
            echo "::group::$f"; node "$f"; echo "::endgroup::"
          done
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # js·css 주소에 커밋 번호를 붙여, 배포 뒤 새로고침하면 바로 새 파일을 받게 한다 (캐시 10분)
      - name: Stamp asset URLs
        run: python3 tools/stamp_assets.py "${GITHUB_SHA::7}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
