name: Check Library · Deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # test 를 통과한 main 커밋만 cloudflare 잡이 connbook.yalex-k.com 에 배포한다
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 책마다 복사해 쓰는 공통 코드(js/common.js, css/style.css)가 shared/ 원본과 같은가
      - name: Shared code in sync
        run: python3 tools/sync_shared.py --check
      - name: Library search index up to date
        run: python3 tools/build_search.py --check
      - name: Glossary terms have tooltips
        run: python3 tools/mark_terms.py --check
      - name: Spec citations link to the Core spec
        run: python3 tools/spec_links.py --check
      # 책마다 scripts/verify-factcheck.cjs가 있으면 실행한다
      - name: Verify every book
        run: |
          set -e
          for f in */scripts/verify-factcheck.cjs; do
            [ -e "$f" ] || continue
            echo "::group::$f"; node "$f"; echo "::endgroup::"
          done
      # 출력 폴더가 저장소 안이어도 안내 페이지 수가 원본 HTML 수와 같아야 한다 (자기 출력을 다시 읽지 않는지)
      - name: Pages redirect site builds
        run: |
          python3 tools/pages_redirect.py _redirect_check
          want=$(find . -name '*.html' -not -path './_redirect_check/*' -not -path './video/*' -not -path './shared/*' -not -path '*/node_modules/*' | wc -l)
          got=$(find _redirect_check -name '*.html' ! -name 404.html | wc -l)
          echo "html: $want, redirect pages: $got"
          test "$want" = "$got"
          rm -rf _redirect_check
  # 서재 본체 — connbook.yalex-k.com (Cloudflare Workers 정적 자산, cloudflare/wrangler.jsonc)
  # 저장소 Secret CLOUDFLARE_API_TOKEN 이 필요하다
  cloudflare:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: cloudflare
      url: https://connbook.yalex-k.com/
    steps:
      - uses: actions/checkout@v4
      # 커밋된 파일에서 점 파일·cloudflare/ 를 빼고, js·css 주소에 커밋 번호를 붙인다
      - name: Build site
        run: sh tools/build_site.sh "$GITHUB_SHA"
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.156.2"
          command: deploy -c cloudflare/wrangler.jsonc
  # 예전 GitHub Pages 주소로 오는 사람을 connbook.yalex-k.com 의 같은 페이지로 넘긴다
  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build redirect site
        run: python3 tools/pages_redirect.py "$RUNNER_TEMP/pages-redirect"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
